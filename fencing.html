      + '<input class="text-input" data-bind="rename" data-id="' + f.id + '" value="' + esc(f.name) + '" placeholder="name" autocapitalize="words" autocomplete="off">'
      + (showRank ? rankChip(f) : '')
      + (showLives ? stepperHTML('startlife', f.id, clampLives(f.startingLives || m.defaultLives), 1) : '')
      + '<button class="x" data-action="remove-fencer" data-id="' + f.id + '" aria-label="remove">×</button>'
      + '</div>'
    ).join('');

    const named = state.fencers.filter(f => (f.name || '').trim().length).length;

    app.innerHTML =
      '<h1 class="page-title">⚔ tournament setup</h1>'
      + '<section class="panel">'
      + '<label class="field"><span>tournament name</span>'
      + '<input class="text-input" data-bind="name" value="' + esc(m.name) + '" placeholder="1v1 final destination fox only no items 4 stocks 8 minutes GO!" autocapitalize="words" autocomplete="off"></label>'

      + '<div class="field"><span>format</span>'
      + '<div class="segmented">'
      + '<button data-action="set-format" data-format="lives" class="' + (m.format !== 'pools' ? 'on' : '') + '">lives only</button>'
      + '<button data-action="set-format" data-format="pools" class="' + (m.format === 'pools' ? 'on' : '') + '">pools → bracket</button>'
      + '</div>'
      + '<p class="hint">' + (m.format === 'pools'
          ? 'Round-robin pools, then the top fencers (overall) advance into the lives bracket.'
          : 'Straight lives bracket — last fencer standing wins.') + '</p></div>'

      + '<div class="field suggest" id="format-suggestion">' + suggestionHTML() + '</div>'

      + '<div class="field"><span>mode</span>'
      + '<div class="segmented">'
      + '<button data-action="set-mode" data-mode="unweighted" class="' + (!weighted ? 'on' : '') + '">unweighted</button>'
      + '<button data-action="set-mode" data-mode="weighted" class="' + (weighted ? 'on' : '') + '">weighted</button>'
      + '</div>'
      + '<p class="hint">' + (m.format === 'pools'
          ? (weighted ? 'Pools are seeded by rank so each pool gets a fair spread of strong and weak fencers.'
                      : 'Fencers are distributed into pools at random.')
          : (weighted ? 'Each fencer starts with the lives you set — more lives = more chances to prove yourself.'
                      : 'Everyone starts with the same number of lives.')) + '</p></div>'

      + ((m.format !== 'pools' && !weighted)
          ? '<div class="field"><span>starting lives (everyone)</span>' + stepperHTML('deflife', '', m.defaultLives, 1) + '</div>'
          : '')

      + (m.format === 'pools'
          ? '<div class="field"><span>number of pools</span>' + stepperHTML('numpools', '', m.numPools, 1)
            + '<p class="hint" id="pool-preview">' + poolPreview() + '</p></div>'
            + '<div class="field"><span>advance to bracket · top N overall</span>' + stepperHTML('advance', '', m.advanceCount, 1) + '</div>'
            + '<div class="field"><span>guarantee top N per pool</span>' + stepperHTML('guarantee', '', m.guaranteePerPool || 0, 0)
            + '<p class="hint">' + ((m.guaranteePerPool || 0) > 0
                ? 'Top ' + m.guaranteePerPool + ' of every pool advance automatically; remaining slots go to the best records overall.'
                : 'Pure overall cut — best records across all pools advance.') + '</p></div>'
            + '<div class="field"><span>starting lives · bracket (everyone)</span>' + stepperHTML('deflife', '', m.defaultLives, 1) + '</div>'
          : '')

      + '<div class="field"><span id="fencer-count">fencers · ' + named + '</span>'
      + '<div class="fencer-rows">' + rows + '</div>'
      + '<div class="row wrap"><button class="btn ghost" data-action="add-fencer-setup">+ add fencer</button>'
      + '<button class="btn ghost" data-action="open-bulk">paste a list</button></div></div>'

      + '<button class="btn primary big" id="start-btn" data-action="start" ' + (named >= 2 ? '' : 'disabled') + '>start tournament →</button>'
      + '<button class="btn ghost" data-action="open-import">import a saved tournament</button>'
      + '</section>';
  }

  // ---- live ----
  // ---- records & history (computed from state.rounds) ----
  function fencerRecord(id) {
    let w = 0, l = 0, d = 0, byes = 0;
    state.rounds.forEach(r => r.pairings.forEach(p => {
      if (p.fencerB == null) { if (p.fencerA === id) byes++; return; }
      if (p.result == null) return;
      if (p.result === 'double') { if (p.fencerA === id || p.fencerB === id) d++; return; }
      const winner = p.result === 'A' ? p.fencerA : p.fencerB;
      const loser = p.result === 'A' ? p.fencerB : p.fencerA;
      if (winner === id) w++; else if (loser === id) l++;
    }));
    return { w: w, l: l, d: d, byes: byes };
  }
  function recordLabel(id) {
    const rec = fencerRecord(id);
    return rec.d ? (rec.w + '-' + rec.l + '-' + rec.d) : (rec.w + '-' + rec.l);
  }
  function renderHistory() {
    let html = '';
    if (state.pools && state.pools.length) {
      html += '<div class="history">' + state.pools.map(g => {
        const standing = poolStanding(g);
        return '<div class="hround"><div class="hround-t">pool ' + g.index + '</div>'
          + renderPoolGrid(g)
          + standing.map((id, i) => '<div class="hbout">' + (i + 1) + '. <b>' + esc(nameOf(id)) + '</b> ' + rkTag(id) + ' — ' + poolWins(id) + 'W</div>').join('')
          + '</div>';
      }).join('') + '</div>';
    }
    if (state.rounds.length) {
      const rounds = state.rounds.slice().reverse();
      html += '<div class="history"' + (html ? ' style="margin-top:.75rem"' : '') + '>' + rounds.map(r => {
        const bouts = r.pairings.map(p => {
          if (p.fencerB == null) return '<div class="hbout">🛡 bye — ' + esc(nameOf(p.fencerA)) + '</div>';
          const A = esc(nameOf(p.fencerA)), B = esc(nameOf(p.fencerB));
          let txt;
          if (p.result === 'A') txt = '<b>' + A + '</b> beat ' + B;
          else if (p.result === 'B') txt = '<b>' + B + '</b> beat ' + A;
          else if (p.result === 'double') txt = '⚔ double — ' + A + ' / ' + B;
          else txt = A + ' vs ' + B + ' <span class="pend">(pending)</span>';
          return '<div class="hbout">' + txt + '</div>';
        }).join('');
        return '<div class="hround"><div class="hround-t">' + (state.meta.format === 'pools' ? 'bracket round ' : 'round ') + r.index + '</div>' + bouts + '</div>';
      }).join('') + '</div>';
    }
    return html || '<p class="hint">No rounds played yet.</p>';
  }

  // ---- pools screen ----
  function cellResult(g, x, y) {
    const bt = g.bouts.find(b => (b.a === x && b.b === y) || (b.a === y && b.b === x));
    if (!bt || !bt.result) return '';
    if (bt.result === 'draw') return 'D';
    if (bt.result === 'double') return 'L';   // double = both lose
    const winner = bt.result === 'A' ? bt.a : bt.b;
    return winner === x ? 'W' : 'L';
  }
  function renderPoolGrid(g) {
    const ids = g.fencerIds;
    let h = '<div class="grid-scroll"><table class="poule"><tr><th class="corner"></th>';
    ids.forEach((id, j) => { h += '<th class="colh">' + (j + 1) + '</th>'; });
    h += '</tr>';
    ids.forEach((id, i) => {
      h += '<tr><th class="rowh">' + (i + 1) + '. ' + esc(nameOf(id)) + '</th>';
      ids.forEach((jd, j) => {
        if (i === j) { h += '<td class="cell x">✕</td>'; return; }
        const r = cellResult(g, id, jd);
        h += '<td class="cell ' + (r ? 'r' + r : 'pend') + '">' + r + '</td>';
      });
      h += '</tr>';
    });
    return h + '</table></div>';
  }
  function renderPoolBout(g, bt) {
    const A = esc(nameOf(bt.a)), B = esc(nameOf(bt.b));
    if (bt.result == null) {
      const mk = (r, label, cls) => '<button class="btn ' + cls + '" data-action="pool-result" data-i="' + g.index + '" data-bid="' + bt.id + '" data-r="' + r + '">' + label + '</button>';
      return '<div class="bout"><div class="bout-fencers"><span class="bn">' + A + '</span><span class="vs">vs</span><span class="bn">' + B + '</span></div>'
        + '<div class="result-btns" style="grid-template-columns:1fr 1fr">' + mk('A', A + ' won', 'win') + mk('B', B + ' won', 'win') + '</div>'
        + '<div class="result-btns" style="grid-template-columns:1fr 1fr;margin-top:.4rem">' + mk('draw', 'draw', 'draw') + mk('double', 'double · both L', 'draw') + '</div>'
        + '</div>';
    }
    let res;
    if (bt.result === 'draw') res = '⚖ draw — ' + A + ' / ' + B;
    else if (bt.result === 'double') res = '✗ double — ' + A + ' / ' + B + ' (both lose)';
    else res = '✓ ' + (bt.result === 'A' ? A : B) + ' won';
    return '<div class="bout done"><div class="bout-summary"><span class="res">' + res + '</span>'
      + '<button class="btn tiny ghost" data-action="pool-undo-result" data-i="' + g.index + '" data-bid="' + bt.id + '">undo</button></div></div>';
  }
  function renderPoolCard(g) {
    const open = ui.poolOpen[g.index] !== false;
    const standing = poolStanding(g);
    const gpp = state.meta.guaranteePerPool || 0;
    let s = '<div class="card" style="margin-top:1rem"><div class="card-title">'
      + '<button class="btn tiny ghost" data-action="toggle-pool" data-i="' + g.index + '">'
      + (open ? '▾ pool ' : '▸ pool ') + g.index + ' · ' + g.fencerIds.length + ' fencers</button>'
      + '<span class="srec">' + g.bouts.filter(b => b.result).length + '/' + g.bouts.length + '</span></div>';
    if (open) {
      s += renderPoolGrid(g);
      s += '<div class="standings">' + standing.map((id, i) =>
        '<div class="srow' + (gpp && i < gpp ? ' qual' : '') + '"><span class="place">' + (i + 1) + '</span>'
        + '<span class="sname">' + esc(nameOf(id)) + ' ' + rkTag(id) + '</span>'
        + '<span class="srec">' + poolWins(id) + 'W</span></div>').join('') + '</div>';
      s += '<div class="bouts" style="margin-top:.7rem">' + g.bouts.map(bt => renderPoolBout(g, bt)).join('') + '</div>';
    }
    return s + '</div>';
  }
  function renderPools() {
    const m = state.meta;
    const done = poolBoutsDoneCount(), total = poolBoutsTotal();
    const adv = Math.min(m.advanceCount || state.fencers.length, state.fencers.length);
    let html =
      '<div class="lv-head"><div class="title-wrap">'
      + '<input class="lv-name" data-bind="name" value="' + esc(m.name) + '" placeholder="untitled tournament" autocapitalize="words" autocomplete="off">'
      + '<span class="lv-sub">pools · ' + done + '/' + total + ' bouts · top ' + adv + ' advance</span>'
      + '</div><div class="head-btns">'
      + '<button class="menu-btn" data-action="global-undo" aria-label="undo" title="undo last action"' + (undoStack.length ? '' : ' disabled') + '>↶</button>'
      + '<button class="menu-btn" data-action="toggle-menu" aria-label="menu">⋯</button>'
      + '</div></div>';
    if (ui.menuOpen) html += '<div class="menu">'
      + '<button class="btn ghost" data-action="reshuffle-pools">reshuffle pools</button>'
      + '<button class="btn ghost" data-action="open-export">export / back up</button>'
      + '<button class="btn ghost" data-action="open-import">import</button>'
      + '<button class="btn danger" data-action="confirm-reset">reset tournament</button>'
      + '</div>';
    state.pools.forEach(g => { html += renderPoolCard(g); });
    html += '<div class="sticky-bar"><button class="btn primary big" style="width:100%" data-action="advance-to-bracket"' + (poolsComplete() ? '' : ' disabled') + '>to top cut &amp; bracket →</button></div>';
    app.innerHTML = html;
  }

  function renderLive() {
    const m = state.meta;
    const r = currentRound();
    const aliveCount = aliveFencers().length;
    const doubleKO = aliveCount === 0;

    let html =
      '<div class="lv-head">'
      + '<div class="title-wrap">'
      + '<input class="lv-name" data-bind="name" value="' + esc(m.name) + '" placeholder="untitled tournament" autocapitalize="words" autocomplete="off">'
      + '<span class="lv-sub">' + (m.format === 'pools' ? 'top cut · ' : '') + 'round ' + (r ? r.index : 0) + ' · ' + aliveCount + ' still in</span>'
      + '</div>'
      + '<div class="head-btns">'
      + '<button class="menu-btn" data-action="global-undo" aria-label="undo" title="undo last action"' + (undoStack.length ? '' : ' disabled') + '>↶</button>'
      + '<button class="menu-btn" data-action="toggle-menu" aria-label="menu">⋯</button>'
      + '</div>'
      + '</div>';

    if (ui.menuOpen) {
      html += '<div class="menu">'
        + '<button class="btn ghost" data-action="open-export">export / back up</button>'
        + '<button class="btn ghost" data-action="open-import">import</button>'
        + '<button class="btn danger" data-action="confirm-reset">reset tournament</button>'
        + '</div>';
    }

    if (doubleKO) {
      html += '<div class="warn"><div>⚠ The last bout eliminated everyone still in (a double). Choose how to resolve it:</div>'
        + '<div class="row wrap">'
        + '<button class="btn" data-action="undo-last">undo &amp; replay last bout</button>'
        + '<button class="btn primary" data-action="finish">declare co-champions</button>'
        + '</div></div>';
    }

    // round card
    html += '<div class="card"><div class="card-title"><span>round ' + (r ? r.index : 0) + '</span>'
      + (ui.editRound ? '' : '<button class="btn tiny ghost" data-action="edit-round">edit pairings</button>') + '</div>';

    if (ui.editRound) html += renderEditRound();
    else html += renderBouts(r);

    html += '</div>';

    // standings
    html += '<div class="card" style="margin-top:1rem">'
      + '<div class="card-title"><button class="btn tiny ghost" data-action="toggle-standings">'
      + (ui.standingsOpen ? '▾ hide fencers' : '▸ fencers &amp; lives') + '</button>'
      + '<button class="btn tiny" data-action="add-fencer-live">+ add</button></div>';
    if (ui.standingsOpen) html += renderStandings();
    html += '</div>';

    // history + records
    html += '<div class="card" style="margin-top:1rem">'
      + '<div class="card-title"><button class="btn tiny ghost" data-action="toggle-history">'
      + (ui.historyOpen ? '▾ hide rounds &amp; records' : '▸ rounds &amp; records') + '</button></div>';
    if (ui.historyOpen) html += renderHistory();
    html += '</div>';

    // sticky advance
    if (!ui.editRound) {
      const done = roundComplete(r);
      const label = aliveCount <= 1 ? 'see results →' : 'next round →';
      html += '<div class="sticky-bar"><button class="btn primary big" style="width:100%" data-action="advance" ' + (done && !doubleKO ? '' : 'disabled') + '>' + label + '</button></div>';
    }

    app.innerHTML = html;
  }

  function renderBouts(r) {
    if (!r) return '<p class="hint">No round yet.</p>';
    return '<div class="bouts">' + r.pairings.map(p => {
      if (p.fencerB == null) {
        return '<div class="bout"><div class="bye-chip">🛡 <b>' + esc(nameOf(p.fencerA)) + '</b> sits out this round (bye)</div></div>';
      }
      const a = fencerById(p.fencerA), b = fencerById(p.fencerB);
      const head = '<div class="bout-fencers">'
        + '<span class="bn">' + esc(a ? displayName(a) : '?') + ' <span class="lives">' + heartsHTML(a) + '</span></span>'
        + '<span class="vs">vs</span>'
        + '<span class="bn">' + esc(b ? displayName(b) : '?') + ' <span class="lives">' + heartsHTML(b) + '</span></span>'
        + '</div>';
      if (p.result == null) {
        return '<div class="bout">' + head
          + '<div class="result-btns">'
          + '<button class="btn win" data-action="result" data-pid="' + p.id + '" data-r="A">' + esc(a ? displayName(a) : 'A') + ' won</button>'
          + '<button class="btn draw" data-action="result" data-pid="' + p.id + '" data-r="double">double</button>'
          + '<button class="btn win" data-action="result" data-pid="' + p.id + '" data-r="B">' + esc(b ? displayName(b) : 'B') + ' won</button>'
          + '</div></div>';
      }
      let res;
      if (p.result === 'A') res = '✓ ' + esc(a ? displayName(a) : 'A') + ' won';
      else if (p.result === 'B') res = '✓ ' + esc(b ? displayName(b) : 'B') + ' won';
      else res = '⚔ double — both −1';
      return '<div class="bout done">' + head
        + '<div class="bout-summary"><span class="res">' + res + '</span>'
        + '<button class="btn tiny ghost" data-action="undo-result" data-pid="' + p.id + '">undo</button></div></div>';
    }).join('') + '</div>';
  }

  function renderStandings() {
    const ranked = state.fencers.slice().sort((a, b) => {
      if (a.status !== b.status) return a.status === 'alive' ? -1 : 1;
      if (a.status === 'out') return (a.eliminationOrder || 0) > (b.eliminationOrder || 0) ? -1 : 1;
      return b.currentLives - a.currentLives;
    });
    return '<div class="standings">' + ranked.map(f => {
      const editing = ui.fencerEdit === f.id;
      let row = '<div class="srow ' + (f.status === 'out' ? 'out' : '') + '" data-action="edit-fencer" data-id="' + f.id + '">'
        + '<span class="place">' + (f.status === 'out' ? '#' + (state.fencers.filter(x => x.status === 'out').length - f.eliminationOrder + 1) : '•') + '</span>'
        + '<span class="sname">' + esc(displayName(f)) + '</span>'
        + '<span class="srec">' + recordLabel(f.id) + '</span>'
        + '<span class="slives">' + heartsHTML(f) + '</span>'
        + '</div>';
      if (editing) row += renderDrawer(f);
      return row;
    }).join('') + '</div>';
  }

  function renderDrawer(f) {
    return '<div class="drawer">'
      + '<input class="text-input" data-bind="rename" data-id="' + f.id + '" value="' + esc(f.name) + '" autocapitalize="words" autocomplete="off">'
      + '<div class="row" style="justify-content:space-between"><span class="lbl">lives</span>' + stepperHTML('curlife', f.id, f.currentLives == null ? 0 : f.currentLives, 0) + '</div>'
      + '<div class="row wrap">'
      + (f.status === 'out'
          ? '<button class="btn tiny" data-action="revive" data-id="' + f.id + '">revive</button>'
          : '<button class="btn tiny danger" data-action="eliminate" data-id="' + f.id + '">eliminate</button>')
      + '<button class="btn tiny danger" data-action="delete-fencer" data-id="' + f.id + '">delete</button>'
      + '<button class="btn tiny ghost" data-action="close-fencer" data-id="' + f.id + '">done</button>'
      + '</div></div>';
  }

  function renderEditRound() {
    const alive = aliveFencers();
    const optionList = (sel, allowBye) => {
      let o = '';
      if (allowBye) o += '<option value="" ' + (!sel ? 'selected' : '') + '>— bye —</option>';
      else o += '<option value="">—</option>';
      alive.forEach(f => { o += '<option value="' + f.id + '" ' + (sel === f.id ? 'selected' : '') + '>' + esc(displayName(f)) + '</option>'; });
      return o;
    };
    let html = '<p class="hint" style="margin-bottom:.7rem">Pick who fights whom. Each fencer appears once; one may sit out (bye). Saving clears any results already recorded this round.</p>';
    html += '<div class="bouts">';
    ui.draft.forEach((pr, i) => {
      html += '<div class="bout"><div class="row" style="gap:.4rem">'
        + '<select class="text-input" data-draft="' + i + '" data-role="A">' + optionList(pr.A, false) + '</select>'
        + '<span class="vs">vs</span>'
        + '<select class="text-input" data-draft="' + i + '" data-role="B">' + optionList(pr.B, true) + '</select>'
        + '<button class="x" data-action="draft-remove" data-i="' + i + '">×</button>'
        + '</div></div>';
    });
    html += '</div>';
    if (ui.draftError) html += '<p class="hint" style="color:var(--out)">' + esc(ui.draftError) + '</p>';
    html += '<div class="row wrap" style="margin-top:.8rem">'
      + '<button class="btn tiny ghost" data-action="draft-add">+ add bout</button>'
      + '<button class="btn tiny ghost" data-action="draft-auto">auto-pair</button>'
      + '<button class="btn tiny" data-action="draft-cancel">cancel</button>'
      + '<button class="btn tiny primary" data-action="draft-save">save pairings</button>'
      + '</div>';
    return html;
  }

  // ---- finished ----
  function finalRanking() {
    return state.fencers.slice().sort((a, b) => {
      if (a.status !== b.status) return a.status === 'alive' ? -1 : 1;
      if (a.status === 'out') return (b.eliminationOrder || 0) - (a.eliminationOrder || 0);
      return 0;
    });
  }
  function resultsSummaryText() {
    const lines = [];
    lines.push((state.meta.name || 'Tournament').trim());
    lines.push(new Date(state.meta.createdAt || Date.now()).toLocaleDateString() + ' · results');
    lines.push('');
    finalRanking().forEach((f, i) => {
      const rk = (state.meta.format === 'pools' && f.rank && f.rank !== 'N/A') ? ' (' + f.rank + ')' : '';
      lines.push((i + 1) + '. ' + displayName(f) + rk + '  ' + recordLabel(f.id));
    });
    return lines.join('\n');
  }
  function flashShare() { const b = document.getElementById('share-btn'); if (b) { const t = b.textContent; b.textContent = 'copied ✓'; setTimeout(function () { if (b) b.textContent = t; }, 1500); } }
  function shareResults() {
    const text = resultsSummaryText();
    const title = (state.meta.name || 'Tournament') + ' results';
    if (navigator.share) { navigator.share({ title: title, text: text }).catch(function () {}); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(flashShare, function () {});
  }
  function renderFinished() {
    const ranked = finalRanking();
    const pools = state.meta.format === 'pools';
    const champs = state.fencers.filter(f => f.status === 'alive');
    let banner;
    if (champs.length === 1) {
      banner = '<div class="champ-banner"><div class="crown">👑</div><div class="lbl">champion</div><div class="who">' + esc(displayName(champs[0])) + '</div></div>';
    } else if (champs.length === 0) {
      const top = ranked.slice(0, 2).map(f => esc(displayName(f))).join(' & ');
      banner = '<div class="champ-banner"><div class="crown">🤝</div><div class="lbl">co-champions</div><div class="who">' + top + '</div></div>';
    } else {
      banner = '<div class="champ-banner"><div class="crown">⚔</div><div class="lbl">still standing</div><div class="who">' + champs.map(f => esc(displayName(f))).join(' & ') + '</div></div>';
    }

    let list = '<div class="card"><div class="card-title"><span>final standings</span></div><div class="standings">';
    ranked.forEach((f, i) => {
      list += '<div class="srow ' + (f.status === 'out' ? 'out' : '') + '">'
        + '<span class="place">' + (i + 1) + '</span>'
        + '<span class="sname">' + esc(displayName(f)) + (pools ? ' ' + rkTag(f.id) : '') + '</span>'
        + '<span class="srec">' + recordLabel(f.id) + '</span>'
        + '<span class="slives">' + heartsHTML(f) + '</span>'
        + '</div>';
    });
    list += '</div></div>';
    const date = new Date(state.meta.createdAt || Date.now()).toLocaleDateString();

    app.innerHTML =
      '<div class="sheet">'
      + '<div class="sheet-head"><h1 class="page-title">⚔ ' + esc(state.meta.name || 'tournament') + '</h1><div class="sheet-date">' + esc(date) + '</div></div>'
      + banner + list
      + '<div class="card" style="margin-top:1rem"><div class="card-title"><span>round-by-round</span></div>' + renderHistory() + '</div>'
      + '</div>'
      + '<div class="row wrap no-print" style="margin-top:1.2rem">'
      + '<button class="btn" id="share-btn" data-action="share-results">share results</button>'
      + '<button class="btn" data-action="print-results">print</button>'
      + '<button class="btn" data-action="open-export">export</button>'
      + '<button class="btn" data-action="rematch">rematch</button>'
      + '<button class="btn" data-action="global-undo"' + (undoStack.length ? '' : ' disabled') + '>↶ undo</button>'
      + '<button class="btn danger" data-action="confirm-reset">new tournament</button>'
      + '</div>'
      + '<p class="hint no-print" style="margin-top:.8rem">“print” makes a clean black-on-white sheet (or save as PDF); “share” sends/copies the final ranking.</p>';
  }

  // ---- modal ----
  function renderModal() {
    if (!ui.modal) { modalRoot.innerHTML = ''; return; }
    let inner = '';
    if (ui.modal === 'export') {
      inner = '<h2>export tournament</h2>'
        + '<textarea id="export-ta" readonly>' + esc(exportText()) + '</textarea>'
        + '<div class="modal-actions">'
        + '<button class="btn" id="copy-btn" data-action="do-copy">copy</button>'
        + '<button class="btn" data-action="do-download">download .json</button>'
        + '<button class="btn ghost" data-action="close-modal">close</button>'
        + '</div>';
    } else if (ui.modal === 'import') {
      inner = '<h2>import tournament</h2>'
        + '<p class="hint">Paste exported JSON below, or choose a file. This replaces the current tournament.</p>'
        + '<textarea id="import-ta" placeholder="paste tournament JSON here"></textarea>'
        + (ui.modalError ? '<p class="hint" style="color:var(--out)">' + esc(ui.modalError) + '</p>' : '')
        + '<input type="file" id="import-file" accept="application/json,.json" class="hint">'
        + '<div class="modal-actions">'
        + '<button class="btn primary" data-action="do-import">load</button>'
        + '<button class="btn ghost" data-action="close-modal">cancel</button>'
        + '</div>';
    } else if (ui.modal === 'bulk') {
      inner = '<h2>add a list of fencers</h2>'
        + '<p class="hint">One name per line (or comma-separated). Adds them all at once — handy for big rosters.</p>'
        + '<textarea id="bulk-ta" placeholder="Alice&#10;Bob&#10;Cara&#10;..."></textarea>'
        + '<div class="modal-actions">'
        + '<button class="btn primary" data-action="do-bulk">add these</button>'
        + '<button class="btn ghost" data-action="close-modal">cancel</button>'
        + '</div>';
    } else if (ui.modal === 'addfencer') {
      const d = ui.addDraft || { name: '', rank: 'N/A' };
      inner = '<h2>add fencer</h2>'
        + '<input class="text-input" id="add-name" data-bind="addname" value="' + esc(d.name) + '" placeholder="name" autocapitalize="words" autocomplete="off">'
        + (state.meta.format === 'pools'
            ? '<div class="row" style="gap:.6rem;align-items:center;margin-top:.2rem"><span class="lbl">rank</span><button class="btn tiny rkchip rk-' + (d.rank || 'N/A').replace('/', '') + '" data-action="cycle-add-rank">' + (d.rank || 'N/A') + '</button></div>'
            : '')
        + '<div class="modal-actions">'
        + '<button class="btn primary" data-action="do-add-fencer">add to tournament</button>'
        + '<button class="btn ghost" data-action="close-modal">cancel</button>'
        + '</div>';
    } else if (ui.modal === 'reset') {
      inner = '<h2>reset tournament?</h2>'
        + '<p class="hint">This clears all fencers, rounds and lives and returns to setup. This cannot be undone.</p>'
        + '<div class="modal-actions">'
        + '<button class="btn danger" data-action="do-reset">yes, reset everything</button>'
        + '<button class="btn ghost" data-action="close-modal">cancel</button>'
        + '</div>';
    }
    modalRoot.innerHTML = '<div class="modal-bg" data-action="modal-bg"><div class="modal">' + inner + '</div></div>';
  }

  // ---------------- event handling ----------------
  function handleAction(action, ds) {
    switch (action) {
      // setup
      case 'set-mode': state.meta.mode = ds.mode; save(); render(); break;
      case 'add-fencer-setup': state.fencers.push({ id: newFencerId(), name: '', startingLives: state.meta.defaultLives }); save(); render(); break;
      case 'open-bulk': ui.modal = 'bulk'; render(); break;
      case 'do-bulk': bulkAdd(); break;
      case 'remove-fencer': state.fencers = state.fencers.filter(f => f.id !== ds.id); save(); render(); break;
      case 'start': startTournament(); break;
      case 'set-format': state.meta.format = ds.format; save(); render(); break;
      case 'apply-suggestion': { const n = state.fencers.filter(f => (f.name || '').trim().length).length; const sug = suggestFormat(n); if (sug) { Object.keys(sug.cfg).forEach(k => { state.meta[k] = sug.cfg[k]; }); save(); render(); } break; }
      case 'numpools-inc': state.meta.numPools = Math.max(1, (state.meta.numPools || 1) + 1); save(); render(); break;
      case 'numpools-dec': state.meta.numPools = Math.max(1, (state.meta.numPools || 1) - 1); save(); render(); break;
      case 'advance-inc': state.meta.advanceCount = Math.max(1, (state.meta.advanceCount || 1) + 1); save(); render(); break;
      case 'advance-dec': state.meta.advanceCount = Math.max(1, (state.meta.advanceCount || 1) - 1); save(); render(); break;
      case 'guarantee-inc': state.meta.guaranteePerPool = Math.max(0, (state.meta.guaranteePerPool || 0) + 1); save(); render(); break;
      case 'guarantee-dec': state.meta.guaranteePerPool = Math.max(0, (state.meta.guaranteePerPool || 0) - 1); save(); render(); break;
      case 'ranklife-inc': { state.meta.rankLives = state.meta.rankLives || {}; const k = ds.id; const cur = state.meta.rankLives[k] != null ? state.meta.rankLives[k] : state.meta.defaultLives; state.meta.rankLives[k] = Math.max(1, clampLives(cur + 1) || 1); save(); render(); break; }
      case 'ranklife-dec': { state.meta.rankLives = state.meta.rankLives || {}; const k = ds.id; const cur = state.meta.rankLives[k] != null ? state.meta.rankLives[k] : state.meta.defaultLives; state.meta.rankLives[k] = Math.max(1, clampLives(cur - 1)); save(); render(); break; }
      case 'cycle-rank': { const f = fencerById(ds.id); if (f) { const i = RANK_ORDER.indexOf(f.rank || 'N/A'); f.rank = RANK_ORDER[(i + 1) % RANK_ORDER.length]; save(); render(); } break; }
      case 'deflife-inc': state.meta.defaultLives = clampLives(state.meta.defaultLives + 1) || 1; save(); render(); break;
      case 'deflife-dec': state.meta.defaultLives = Math.max(1, clampLives(state.meta.defaultLives - 1)); save(); render(); break;
      case 'startlife-inc': { const f = fencerById(ds.id); if (f) { f.startingLives = clampLives((f.startingLives || 1) + 1) || 1; save(); render(); } break; }
      case 'startlife-dec': { const f = fencerById(ds.id); if (f) { f.startingLives = Math.max(1, clampLives((f.startingLives || 1) - 1)); save(); render(); } break; }

      // live
      case 'toggle-menu': ui.menuOpen = !ui.menuOpen; render(); break;
      case 'result': recordResult(ds.pid, ds.r); break;
      case 'undo-result': undoResult(ds.pid); break;
      case 'undo-last': undoLastResolved(); break;
      case 'advance': advanceRound(); break;
      case 'finish': finishTournament(); break;
      case 'toggle-standings': ui.standingsOpen = !ui.standingsOpen; render(); break;
      case 'toggle-history': ui.historyOpen = !ui.historyOpen; render(); break;
      case 'global-undo': popUndo(); break;
      case 'toggle-pool': ui.poolOpen[ds.i] = ui.poolOpen[ds.i] === false ? true : false; render(); break;
      case 'pool-result': recordPoolResult(ds.i, ds.bid, ds.r); break;
      case 'pool-undo-result': undoPoolResult(ds.i, ds.bid); break;
      case 'advance-to-bracket': advanceToBracket(); break;
      case 'reshuffle-pools': generatePools(); ui.menuOpen = false; save(); render(); break;
      case 'edit-fencer': ui.fencerEdit = ui.fencerEdit === ds.id ? null : ds.id; render(); break;
      case 'close-fencer': ui.fencerEdit = null; render(); break;
      case 'curlife-inc': { const f = fencerById(ds.id); if (f) { setLives(ds.id, (f.currentLives || 0) + 1); render(); } break; }
      case 'curlife-dec': { const f = fencerById(ds.id); if (f) { setLives(ds.id, (f.currentLives || 0) - 1); render(); } break; }
      case 'eliminate': eliminateFencer(ds.id); break;
      case 'revive': reviveFencer(ds.id); break;
      case 'add-fencer-live': addFencerLive(); break;
      case 'cycle-add-rank': { ui.addDraft = ui.addDraft || { name: '', rank: 'N/A' }; const i = RANK_ORDER.indexOf(ui.addDraft.rank || 'N/A'); ui.addDraft.rank = RANK_ORDER[(i + 1) % RANK_ORDER.length]; render(); break; }
      case 'do-add-fencer': {
        const el = document.getElementById('add-name');
        const nm = ((el ? el.value : (ui.addDraft && ui.addDraft.name)) || '').trim();
        if (!nm) return;
        pushUndo();
        const f = { id: newFencerId(), name: nm, startingLives: state.meta.defaultLives, currentLives: Math.max(1, state.meta.defaultLives), status: 'alive', eliminationOrder: null, rank: (ui.addDraft && ui.addDraft.rank) || 'N/A' };
        state.fencers.push(f);
        ui.modal = null; ui.addDraft = null; ui.standingsOpen = true; ui.fencerEdit = f.id;
        save(); render(); break;
      }
      case 'delete-fencer': deleteFencer(ds.id); break;

      // edit round
      case 'edit-round': enterEditRound(); break;
      case 'draft-add': ui.draft.push({ A: '', B: '' }); render(); break;
      case 'draft-remove': ui.draft.splice(parseInt(ds.i, 10), 1); render(); break;
      case 'draft-auto': autoFillDraft(); break;
      case 'draft-cancel': ui.editRound = false; ui.draft = null; ui.draftError = null; render(); break;
      case 'draft-save': saveEditRound(); break;

      // modals / menu
      case 'open-export': ui.modal = 'export'; ui.menuOpen = false; render(); break;
      case 'open-import': ui.modal = 'import'; ui.modalError = null; ui.menuOpen = false; render(); break;
      case 'confirm-reset': ui.modal = 'reset'; ui.menuOpen = false; render(); break;
      case 'do-reset': resetTournament(); break;
      case 'do-copy': doCopy(); break;
      case 'do-download': doDownload(); break;
      case 'do-import': { const ta = document.getElementById('import-ta'); const err = tryImport(ta ? ta.value : ''); if (err) { ui.modalError = err; render(); } break; }
      case 'close-modal': ui.modal = null; ui.modalError = null; render(); break;
      case 'modal-bg': break; // handled by target check below
      case 'rematch': rematchSameFencers(); break;
      case 'print-results': if (typeof window !== 'undefined' && window.print) window.print(); break;
      case 'share-results': shareResults(); break;
    }
  }

  function undoLastResolved() {
    const r = currentRound(); if (!r) return;
    for (let i = r.pairings.length - 1; i >= 0; i--) {
      const p = r.pairings[i];
      if (p.fencerB != null && p.result != null) { revertResult(p); save(); render(); return; }
    }
  }

  // click delegation
  document.addEventListener('click', e => {
    const bg = e.target.closest('[data-action="modal-bg"]');
    if (bg && e.target === bg) { ui.modal = null; ui.modalError = null; render(); return; }
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action;
    if (act === 'modal-bg') return;
    e.stopPropagation();
    if (MUTATING.has(act)) pushUndo();
    handleAction(act, btn.dataset);
  });

  // text input (no re-render → keeps focus)
  document.addEventListener('input', e => {
    const t = e.target;
    const bind = t.dataset && t.dataset.bind;
    if (!bind) return;
    if (bind === 'name') { state.meta.name = t.value; save(); }
    else if (bind === 'rename') { const f = fencerById(t.dataset.id); if (f) { f.name = t.value; save(); } if (state.meta.status === 'setup') refreshSetupCounts(); }
    else if (bind === 'deflife') { state.meta.defaultLives = clampLives(t.value) || 1; save(); }
    else if (bind === 'startlife') { const f = fencerById(t.dataset.id); if (f) { f.startingLives = clampLives(t.value); save(); } }
    else if (bind === 'curlife') { const f = fencerById(t.dataset.id); if (f) { f.currentLives = clampLives(t.value); save(); } }
    else if (bind === 'numpools') { state.meta.numPools = Math.max(1, parseInt(t.value, 10) || 1); save(); }
    else if (bind === 'advance') { state.meta.advanceCount = Math.max(1, parseInt(t.value, 10) || 1); save(); }
    else if (bind === 'guarantee') { state.meta.guaranteePerPool = Math.max(0, parseInt(t.value, 10) || 0); save(); }
    else if (bind === 'ranklife') { state.meta.rankLives = state.meta.rankLives || {}; state.meta.rankLives[t.dataset.id] = Math.max(1, clampLives(t.value)); save(); }
    else if (bind === 'addname') { ui.addDraft = ui.addDraft || { name: '', rank: 'N/A' }; ui.addDraft.name = t.value; }
  });

  // commit life-number edits on blur so status/elimination updates
  document.addEventListener('blur', e => {
    const t = e.target;
    if (t.dataset && t.dataset.bind === 'curlife') { syncAfterLives(); save(); render(); }
  }, true);

  // draft selects
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.draft != null) {
      const i = parseInt(t.dataset.draft, 10);
      if (ui.draft && ui.draft[i]) { ui.draft[i][t.dataset.role] = t.value || (t.dataset.role === 'B' ? null : ''); ui.draftError = null; }
      return;
    }
    if (t.id === 'import-file' && t.files && t.files[0]) {
      const reader = new FileReader();
      reader.onload = () => { pushUndo(); const err = tryImport(String(reader.result)); if (err) { ui.modalError = err; render(); } };
      reader.readAsText(t.files[0]);
    }
  });

  render();
})();
</script>

<script>
  // Register the service worker so the tool works offline once visited
  // (and is installable to the iPhone home screen via Share → Add to Home Screen).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
